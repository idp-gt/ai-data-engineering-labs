apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp-sa
  namespace: mcps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-binding
subjects:
- kind: ServiceAccount
  name: k8s-mcp-sa
  namespace: mcps
roleRef:
  kind: ClusterRole
  name: k8s-mcp-role
  apiGroup: rbac.authorization.k8s.io
